<div class="linked-toolbar">
  <div class="linked-controls">
    <label
      >Month
      <span class="month-field">
        <select
          #month
          [value]="selectedId() ?? ''"
          [style.color-scheme]="theme()"
          (change)="selectMonth(month.value)"
        >
          <option value="">All months</option>
          @for (row of data(); track row.id) {
            <option [value]="row.id">{{ row.month }}</option>
          }
        </select>
        <app-site-icon name="chevron" />
      </span>
    </label>
    @if (selectedId() !== null) {
      <button
        class="reset-month"
        type="button"
        aria-label="Reset month filter"
        (click)="resetMonth()"
      >
        <app-site-icon name="close" />Reset
      </button>
    }
  </div>
  <p class="linked-summary" aria-hidden="true">
    @if (summary().device) {
      <span class="summary-device">{{ summary().device }}</span>
    }
    <span class="summary-value" [class.numeric]="summary().unit">{{ summary().value }}</span>
    @if (summary().unit) {
      <span class="summary-unit">{{ summary().unit }}</span>
    }
  </p>
</div>
<p class="linked-status visually-hidden" role="status" aria-live="polite" aria-atomic="true">
  {{ status() }}
</p>
<div class="linked-pair">
  <section class="linked-card overview" aria-label="Monthly visits overview">
    <nec-bar-chart
      title="Monthly visits"
      description="Choose a month from a bar or the data table."
      [data]="data()"
      rowIdKey="id"
      categoryKey="month"
      [series]="series"
      [categoryTickFormatter]="monthTick"
      [theme]="theme()"
      [height]="250"
      (pointSelect)="selectPoint($event)"
    />
  </section>
  <section class="linked-card detail" aria-label="Linked device share">
    <nec-pie-chart
      [title]="detailTitle()"
      [description]="detailDescription()"
      [data]="share()"
      rowIdKey="id"
      categoryKey="device"
      [measure]="measure"
      [theme]="theme()"
      [innerRadius]="0.6"
      [height]="240"
      (pointSelect)="selectDevice($event)"
    />
  </section>
</div>
