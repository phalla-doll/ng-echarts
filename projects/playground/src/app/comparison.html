<main
  class="comparison-page"
  [class.utility-page]="!referenceMode"
  [class.reference-mode]="referenceMode"
  [class.dark]="theme() === 'dark'"
>
  <header>
    <h1>Bar visual comparison</h1>
    <p>
      Compare bar variants using the same monthly data. Full labels remain in tooltips and the data
      table.
    </p>
    <div class="controls" role="group" aria-label="Bar variants">
      <button
        type="button"
        (click)="showVariant('grouped')"
        [attr.aria-pressed]="variant() === 'grouped'"
      >
        Grouped reference
      </button>
      <button
        type="button"
        (click)="showVariant('stacked')"
        [attr.aria-pressed]="variant() === 'stacked'"
      >
        Stacked reference
      </button>
      <button
        type="button"
        (click)="showVariant('horizontal')"
        [attr.aria-pressed]="variant() === 'horizontal'"
      >
        Horizontal reference
      </button>
      <button
        type="button"
        (click)="showVariant('gradient')"
        [attr.aria-pressed]="variant() === 'gradient'"
      >
        Gradient reference
      </button>
    </div>
    <div class="controls display-options" role="group" aria-label="Display options">
      <button type="button" (click)="toggleTheme()" [hidden]="!referenceMode">
        Toggle comparison theme
      </button>
      <button type="button" [attr.aria-pressed]="abbreviated()" (click)="toggleTicks()">
        Abbreviate category ticks
      </button>
      <button
        type="button"
        [attr.aria-pressed]="invalidFormatter()"
        (click)="toggleFormatterError()"
      >
        Simulate formatter error
      </button>
    </div>
  </header>
  <div class="comparison-host">
    <nec-bar-chart
      title="Device visits by month"
      description="Monthly desktop and mobile visits. Use the legend to change visibility or open the data table to explore values."
      [data]="rows()"
      rowIdKey="id"
      categoryKey="month"
      [series]="series()"
      [layout]="layout()"
      [stacked]="stacked()"
      [gradient]="gradient()"
      [style.--nec-series-1]="seriesColor()"
      [theme]="theme()"
      [categoryTickFormatter]="tickFormatter()"
      [height]="360"
    />
  </div>
</main>
