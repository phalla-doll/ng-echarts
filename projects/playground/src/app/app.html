<main [class.dark]="darkTheme()">
  <div class="workspace">
    <header class="page-header">
      <div>
        <p class="eyebrow">Angular 22 · ECharts</p>
        <h1>ng-echarts playground</h1>
        <p class="intro">A workspace for building and validating native Angular charts.</p>
      </div>
      <button type="button" [attr.aria-pressed]="darkTheme()" (click)="toggleTheme()">
        {{ themeLabel() }}
      </button>
    </header>
    <div class="controls" aria-label="Prototype scenarios">
      <button type="button" [attr.aria-pressed]="horizontal()" (click)="toggleLayout()">
        Horizontal layout
      </button>
      <button type="button" [attr.aria-pressed]="stacked()" (click)="toggleStack()">
        Stack series
      </button>
      <button type="button" [attr.aria-pressed]="gradient()" (click)="toggleGradient()">
        Gradient fills
      </button>
      <button type="button" [attr.aria-pressed]="loading()" (click)="toggleLoading()">
        Loading state
      </button>
      <button type="button" [attr.aria-pressed]="failure()" (click)="toggleError()">
        Error state
      </button>
      <button type="button" [attr.aria-pressed]="empty()" (click)="toggleEmpty()">
        Empty data
      </button>
      <button type="button" (click)="updateValues()">Update values</button>
      <button type="button" [attr.aria-pressed]="mounted()" (click)="toggleMount()">
        Show chart
      </button>
    </div>
    @if (mounted()) {
      <nec-bar-chart
        title="Device visits by month"
        description="Monthly desktop and mobile visits. Use the legend to change visibility or open the data table to explore values."
        [data]="rows()"
        rowIdKey="id"
        categoryKey="month"
        [series]="series"
        [categoryTickFormatter]="categoryTickFormatter"
        [theme]="theme()"
        [layout]="layout()"
        [stacked]="stacked()"
        [gradient]="gradient()"
        [loading]="loading()"
        [error]="error()"
        [height]="360"
        (pointSelect)="showPoint($event)"
      />
    }
    <p class="selection" role="status">{{ selectedPoint() }}</p>
    <p class="status">
      Experimental bar prototype · visual parity and feasibility gates are pending.
    </p>
  </div>
</main>
