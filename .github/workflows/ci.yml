name: Workspace checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check:workspace
      - run: npm run release:local
      - run: npm run check:release-immutability
      - name: Retain installed consumer failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-consumer-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain exact candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: |
            dist/releases/
            docs/experiments/data/local-release-*.json
            docs/experiments/data/reproducibility-*.json
          if-no-files-found: ignore
          retention-days: 14

  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # Seal/check the clean checkout before benchmark evidence files are refreshed.
      - run: npm run build:pages
      - run: npm run check:pages
      - run: npm run check:demo-performance

  browser:
    runs-on: ubuntu-latest
    # Match the locked Playwright release and current Ubuntu test environment.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-resolute@sha256:916c9fb63a8340822589dd5c821dae82e8012106bb8515a72f278d97f277446a
      options: --user 1001
    # Firefox was still passing scenarios when its 20-minute job limit expired.
    timeout-minutes: ${{ matrix.browser == 'firefox' && 25 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run build
      - name: Verify WebKit horizontal hit targets before the full suite
        if: matrix.browser == 'webkit'
        run: npm run test:browser -- tests/browser/horizontal-composed.spec.ts --project=webkit --max-failures=1
      - run: npm run test:browser -- --project=${{ matrix.browser }} --max-failures=1
      - name: Retain browser failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-evidence-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the original required-check name while requiring every split job.
  check:
    if: always()
    needs: [workspace, pages, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all workspace, Pages and browser jobs
        env:
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
          PAGES_RESULT: ${{ needs.pages.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$WORKSPACE_RESULT" = success
          test "$PAGES_RESULT" = success
          test "$BROWSER_RESULT" = success
